packages:
    - packages/*
    - apps/*
    - examples/*

catalog:
    "@arethetypeswrong/core": ^0.18.5
    "@size-limit/preset-small-lib": ^14.3.0
    "@types/node": ^26.6.6
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitest/browser-playwright": ^5.1.0
    "@vitest/coverage-v8": ^5.1.0
    "@vitest/ui": ^5.1.0
    playwright: ^1.65.0
    publint: ^0.3.25
    react: ^19.3.1
    react-dom: ^19.3.1
    size-limit: ^14.3.0
    tsdown: ^0.23.7
    typescript: ^7.0.2
    vite: ^8.3.6
    vitest: ^5.1.0

# Supply-chain checks. pnpm 12 defaults to the first three already; they're spelled out so that a change of defaults
# can't loosen them.
# Versions younger than a day aren't installed, which is how long a malicious release usually survives.
minimumReleaseAge: 1440
# Only direct dependencies may come from git or a URL.
blockExoticSubdeps: true
# Dependencies may not run install scripts unless allowBuilds lists them.
strictDepBuilds: true
# Fails when a package loses the trusted publisher or provenance that its earlier versions had.
trustPolicy: no-downgrade
