name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# A new push to a pull request cancels its older run. A run on main that has started always finishes, because its
# last jobs deploy and release; a newer push only replaces one that is still queued.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm lint

    typecheck:
        name: Typecheck
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm typecheck

    build:
        name: Build and size
        needs: typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm build
            - run: pnpm size

    test:
        name: Test
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup

            - name: Read the Playwright version
              id: playwright
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

            - name: Install Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Chromium system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            - run: pnpm test

            - name: Upload coverage
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage
                  path: packages/*/coverage/
                  if-no-files-found: ignore

            - name: Upload screenshots of failed browser tests
              if: ${{ failure() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: failure-screenshots
                  path: packages/*/.vitest/
                  include-hidden-files: true
                  if-no-files-found: ignore

    deploy:
        name: Deploy demo
        needs: test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm --filter @zimaleto/playground build
            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/playground/dist
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    release:
        name: Release
        needs: deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Staging on npm takes an OIDC token; everything written to GitHub goes through the release app's token.
        permissions:
            contents: read
            id-token: write
        environment: npm
        steps:
            # A pull request opened with the default token wouldn't trigger CI, so the release app opens it.
            - id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The changelog needs the history, and the release script looks for existing tags.
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/setup
            # With changesets left, it opens or updates the Version Packages PR; without, it runs the release script.
            - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  publish-script: pnpm release
                  pr-title: "chore: version packages"
                  commit-message: "chore: version packages"
