name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# A new push to a pull request cancels its older run. A run on main that has started always finishes, because its
# last jobs will deploy and release; a newer push only replaces one that is still queued.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm lint

    typecheck:
        name: Typecheck
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm typecheck

    build:
        name: Build and size
        needs: typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm build
            - run: pnpm size

    test:
        name: Test
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup

            - name: Read the Playwright version
              id: playwright
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

            - name: Install Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Chromium system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            - run: pnpm test

            - name: Upload coverage
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: packages/*/coverage/
                  if-no-files-found: ignore

            - name: Upload screenshots of failed browser tests
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: failure-screenshots
                  path: packages/*/.vitest/
                  include-hidden-files: true
                  if-no-files-found: ignore
